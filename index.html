<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador de prácticas SAMI</title>
<meta name="description" content="Buscador de prácticas y valores de centros de diagnóstico - SAMI Osmecon La Matanza">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="adminbar" id="adminbar" hidden>
  <div class="wrap">
    <strong><i></i>Modo administrador</strong>
    <span class="pend" id="pend"><span id="pendTxt"></span><button type="button" class="ghost" id="bDiscard">Descartar</button><button type="button" id="bPub">Publicar cambios</button></span>
    <button class="btn" type="button" id="bAdd">+ Agregar práctica</button>
    <button class="btn" type="button" id="bAum">Aumentar valores</button>
    <button class="btn" type="button" id="bVig">Fecha de vigencia</button>
    <button class="btn" type="button" id="bImp">Importar Excel</button>
    <button class="btn" type="button" id="bCsv">Descargar base</button>
    <button class="btn" type="button" id="bOut">Salir</button>
  </div>
</div>

<header class="hdr" id="sb">
  <div class="wrap">
    <div class="brandrow">
      <img class="hlogo" src="logo-blanco.png" alt="SAMI Osmecon La Matanza" width="195" height="116">
      <span class="hdiv" aria-hidden="true"></span>
      <div class="htxt">
        <h1>Buscador de prácticas</h1>
        <p id="vig">Valores vigentes al <b>—</b></p>
      </div>
    </div>
    <div class="qwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">Buscar práctica o código</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Escribí una práctica o un código">
      <button id="clear" type="button" aria-label="Borrar búsqueda" hidden>×</button>
    </div>
    <div class="frow">
      <label class="sr" for="centro">Centro</label>
      <div class="pill"><select id="centro"><option value="">Todos los centros</option></select></div>
      <label class="sr" for="orden">Orden</label>
      <div class="pill"><select id="orden">
        <option value="asc">Menor precio primero</option>
        <option value="desc">Mayor precio primero</option>
        <option value="centro">Centro (A-Z)</option>
        <option value="practica">Práctica (A-Z)</option>
      </select></div>
      <span class="count" id="count"></span>
      <button type="button" class="pbtn" id="bPrint" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>Imprimir (PDF)</button>
    </div>
  </div>
</header>

<main class="wrap" id="out" aria-live="polite"></main>

<button id="admTab" type="button" aria-label="Acceso administrador">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  <span id="admTabTxt">Administrador</span>
</button>

<div id="modal"></div>
<div id="toastBox"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
